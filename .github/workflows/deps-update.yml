name: Dependency Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      report_only:
        description: Evaluate policy and compatibility updates without creating PRs
        required: false
        default: false
        type: boolean

concurrency: deps-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Ownership and compatibility boundaries are documented in
    # ../docs/policies/dependency-automation.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install (scripts disabled)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore deps state cache
        id: cache-restore
        uses: actions/cache@v6
        with:
          path: .cache/deps-state.json
          key: deps-state

      - name: Run dependency update
        run: |
          if [ "${{ inputs.report_only }}" = "true" ]; then
            bun run pkg-update:ci --report-only
          else
            bun run pkg-update:ci
          fi
        env:
          GH_TOKEN: ${{ secrets.SALAFIDURUS_PR_WRITE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Save deps state cache
        uses: actions/cache/save@v6
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: .cache/deps-state.json
          key: deps-state
