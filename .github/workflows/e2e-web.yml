name: e2e-web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/core-api/**"
      - "packages/core-contracts/**"
      - "packages/core-i18n/**"
      - "packages/design-tokens/**"
      - "packages/domain-account/**"
      - "packages/domain-audio/**"
      - "packages/domain-content/**"
      - "packages/domain-search/**"
      - "tsconfig.base.json"
      - "tsconfig.packages.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/e2e-web.yml"

concurrency:
  group: e2e-web-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e_web:
    name: e2e:web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (scripts disabled)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || 'http://localhost:3000' }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: bun run turbo run build --filter=web...

      - name: Run Bun.WebView journeys
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || 'http://localhost:3000' }}
          BUN_E2E_PORT: "3008"
        run: bun run --filter web test:e2e

      - name: Upload Bun.WebView diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bun-webview-test-results
          path: apps/web/test-results/bun-webview
