name: cache:playwright

on:
  push:
    branches:
      - main
    paths:
      - "bun.lock"
      - "apps/web/package.json"
      - ".github/workflows/cache-playwright.yml"

concurrency:
  group: cache-pw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  build_cache:
    name: build:cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (scripts disabled)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Get Playwright version
        id: playwright-version
        # `bun run --filter` prefixes output lines with "web playwright:version:", so the
        # version must be extracted from anywhere in the line — a `grep ^Version` returns
        # nothing, collapsing the cache key to a versionless one that pins stale browsers.
        run: |
          version=$(bun run --filter web playwright:version | grep -o 'Version [0-9][0-9.]*' | cut -d' ' -f2)
          [ -n "$version" ] || { echo "Failed to detect Playwright version"; exit 1; }
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --filter web playwright:install
