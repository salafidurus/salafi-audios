name: Dependabot Sync

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "**/package.json"
      - "bun.lock"
      - "catalog.config.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Validate Dependabot Helper policy
        run: bun infra/dependabot-helper/cli.ts validate

      - name: Determine changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" --name-only > /tmp/pr-files.txt
          if [ -s /tmp/pr-files.txt ]; then
            echo "needs-update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate PR file allowlist
        id: input-files
        if: steps.files.outputs.needs-update == 'true'
        continue-on-error: true
        run: bun infra/dependabot-helper/cli.ts validate-files /tmp/pr-files.txt

      - name: Apply PR package.json changes (data only, no scripts)
        if: steps.files.outputs.needs-update == 'true' && steps.input-files.outcome == 'success'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$PR_HEAD_SHA"
          git checkout "$PR_HEAD_SHA" -- ':(glob)**/package.json' 'bun.lock' 'catalog.config.json'

      - name: Normalize catalog and produce repair report
        id: repair
        if: steps.files.outputs.needs-update == 'true' && steps.input-files.outcome == 'success'
        continue-on-error: true
        env:
          REPORT_FILE: /tmp/dependabot-report.json
        run: |
          set +e
          bun infra/dependabot-helper/cli.ts align > "$REPORT_FILE"
          status=$?
          if [ ! -s "$REPORT_FILE" ]; then
            exit 1
          fi
          exit "$status"

      - name: Install and validate lockfile
        id: install
        if: steps.repair.outcome == 'success'
        run: bun install --ignore-scripts

      - name: Validate final generated files
        id: output-files
        if: steps.repair.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$PR_HEAD_SHA" > /tmp/final-files.txt
          bun infra/dependabot-helper/cli.ts validate-files /tmp/final-files.txt

      - name: Stage + commit scoped changes
        id: commit
        if: steps.repair.outcome == 'success' && steps.install.outcome == 'success' && steps.output-files.outcome == 'success'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add -- ':(glob)**/package.json' 'bun.lock' 'catalog.config.json'
          if git diff --cached --quiet "$PR_HEAD_SHA" -- ':(glob)**/package.json' 'bun.lock' 'catalog.config.json'; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            TREE=$(git write-tree)
            NEW_SHA=$(git commit-tree "$TREE" -p "$PR_HEAD_SHA" -m "chore(deps): align catalog + regenerate bun.lock for dependabot")
            echo "commit_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push back to PR branch
        id: push
        continue-on-error: true
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SALAFIDURUS_PR_WRITE }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          case "$PR_HEAD_REF" in
            dependabot/*) ;;
            *) echo "Refusing to push to unexpected branch: $PR_HEAD_REF" >&2; exit 1 ;;
          esac
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$COMMIT_SHA:refs/heads/$PR_HEAD_REF"

      - name: Prepare audit report
        if: always() && steps.files.outputs.needs-update == 'true'
        env:
          ALLOWLIST_OUTCOME: ${{ steps.input-files.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OUTPUT_OUTCOME: ${{ steps.output-files.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          if [ ! -s /tmp/dependabot-report.json ]; then
            jq -n --arg reason "Dependabot synchronization rejected before repair (allowlist: $ALLOWLIST_OUTCOME, repair: $REPAIR_OUTCOME, install: $INSTALL_OUTCOME, output: $OUTPUT_OUTCOME, push: $PUSH_OUTCOME)" \
              '{status:"rejected", mutations:[], updatedFiles:[], issues:[], reason:$reason, lockfile:"unchanged"}' > /tmp/dependabot-report.json
          elif [ "$INSTALL_OUTCOME" = "success" ]; then
            jq '.lockfile = "validated"' /tmp/dependabot-report.json > /tmp/dependabot-report.validated.json
            mv /tmp/dependabot-report.validated.json /tmp/dependabot-report.json
          fi
          if [ "$PUSH_OUTCOME" = "failure" ]; then
            jq '.status = "rejected" | .reason = "Repair commit was created but push-back failed"' /tmp/dependabot-report.json > /tmp/dependabot-report.push-failed.json
            mv /tmp/dependabot-report.push-failed.json /tmp/dependabot-report.json
          fi

      - name: Render audit comment
        if: always() && steps.files.outputs.needs-update == 'true'
        env:
          DEPENDABOT_VALIDATION: ${{ steps.install.outcome == 'success' && 'passed' || 'failed' }}
          DEPENDABOT_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          DEPENDABOT_REJECTION_REASON: ${{ steps.repair.outcome != 'success' && 'Repair was rejected or failed; no write-back was performed.' || steps.output-files.outcome != 'success' && 'Generated files failed the Dependabot allowlist.' || steps.push.outcome == 'failure' && 'Repair commit was created but push-back failed.' || '' }}
        run: bun infra/dependabot-helper/cli.ts render /tmp/dependabot-report.json /tmp/dependabot-audit.md

      - name: Comment audit result
        if: always() && steps.files.outputs.needs-update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" > /tmp/dependabot-comments.json
          if ! jq -e --arg body "$(cat /tmp/dependabot-audit.md)" 'any(.[]; .body == $body)' /tmp/dependabot-comments.json > /dev/null; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/dependabot-audit.md
          fi

      - name: Fail rejected synchronization
        if: always() && steps.files.outputs.needs-update == 'true'
        run: |
          test "${{ steps.input-files.outcome }}" = success
          test "${{ steps.repair.outcome }}" = success
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.output-files.outcome }}" = success
          if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
            test "${{ steps.push.outcome }}" = success
          fi
