name: deployment-scripts

on:
  pull_request:
    branches:
      - main
      - spec/**
    paths:
      - "scripts/deploy/**"
      - "scripts/utils/**"
      - ".github/workflows/deployment-scripts.yml"
      - "scripts/package.json"
      - "package.json"
      - "bun.lock"
      - "turbo.json"

concurrency:
  group: deployment-scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-deploy-install:
    name: Verify Deploy Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Deploy Script Unit Tests
        run: bun run --filter @sd/scripts test:deploy

      - name: Verify Web Deploy Install Script
        run: bun run --filter @sd/scripts deploy:install -- web

  verify-deploy-build:
    name: Verify Deploy Build Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Web Deploy Build Script
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000/api' }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || 'http://localhost:3000' }}
        run: bun run --filter @sd/scripts deploy:build -- web
