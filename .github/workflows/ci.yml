name: ci

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - ".bun-version"
      - "tsconfig*.json"
      - ".oxlintrc*"
      - "jest.config.*"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/ci.yml"
      - "!**/*.md"

# Cancel stale runs on the same PR to save CI minutes on rapid pushes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'preview' && 'preview' || github.base_ref == 'production' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Install without running lifecycle scripts to avoid exposing secrets
      # to untrusted package install code.
      - name: Install dependencies (scripts disabled)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build, lint, typecheck, test
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || 'http://localhost:3000' }}
          PRIMARY_DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
          PRIMARY_DIRECT_DATABASE_URL: ${{ secrets.PRIMARY_DIRECT_DATABASE_URL || secrets.PRIMARY_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
          ANALYTICS_DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_analytics' }}
          ANALYTICS_IDENTITY_HMAC_SECRET: ci-analytics-identity-secret-0123456789
        run: bun run turbo run build lint typecheck test --continue
