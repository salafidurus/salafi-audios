name: close-completed-specs

on:
  issues:
    types:
      - closed

permissions:
  issues: write

jobs:
  close-parent-spec:
    name: Finalize completed ticket metadata
    if: ${{ contains(join(github.event.issue.labels.*.name, ','), 'ticket') }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove ready-for-agent from completed ticket
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels ?? []).map((label) =>
              typeof label === "string" ? label : label.name,
            );

            if (!labels.includes("ready-for-agent")) {
              core.info(`Ticket #${issue.number} has no ready-for-agent label.`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              name: "ready-for-agent",
            });

            core.info(`Removed ready-for-agent from completed ticket #${issue.number}.`);
