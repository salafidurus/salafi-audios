name: close-completed-specs

on:
  issues:
    types:
      - closed

permissions:
  issues: write

jobs:
  close-parent-spec:
    name: Close completed parent spec
    if: ${{ contains(join(github.event.issue.labels.*.name, ','), 'ticket') }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove ready-for-agent from completed ticket
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels ?? []).map((label) =>
              typeof label === "string" ? label : label.name,
            );

            if (!labels.includes("ready-for-agent")) {
              core.info(`Ticket #${issue.number} has no ready-for-agent label.`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              name: "ready-for-agent",
            });

            core.info(`Removed ready-for-agent from completed ticket #${issue.number}.`);

      - name: Close spec when every linked ticket is complete
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue?.body ?? "";
            const parentMatches = [...body.matchAll(/(?:^|\n)\s*Part of\s+#(\d+)\b/gi)];

            if (parentMatches.length !== 1) {
              core.info("Closed ticket does not have exactly one Part of #<spec> parent.");
              return;
            }

            const parentNumber = Number(parentMatches[0][1]);
            const { data: parent } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parentNumber,
            });

            const parentLabels = parent.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );

            if (parent.pull_request || !parentLabels.includes("spec") || parent.state !== "open") {
              core.info("Parent is not an open spec issue.");
              return;
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });

            const childIssues = allIssues.filter((candidate) => {
              if (candidate.pull_request || !candidate.labels.some((label) => label.name === "ticket")) {
                return false;
              }

              const candidateBody = candidate.body ?? "";
              return new RegExp(`(?:^|\\n)\\s*Part of\\s+#${parentNumber}\\b`, "i").test(candidateBody);
            });

            if (childIssues.length === 0) {
              core.warning(`Spec #${parentNumber} has no linked ticket issues; leaving it open.`);
              return;
            }

            const openChildren = childIssues.filter((child) => child.state !== "closed");
            if (openChildren.length > 0) {
              core.info(
                `Spec #${parentNumber} still has open tickets: ${openChildren.map((child) => `#${child.number}`).join(", ")}`,
              );
              return;
            }

            const completedChildren = childIssues
              .sort((a, b) => a.number - b.number)
              .map((child) => `#${child.number}`)
              .join(", ");

            const triageLabels = [
              "needs-triage",
              "needs-info",
              "ready-for-agent",
              "in-progress",
              "ready-for-human",
            ];
            for (const label of triageLabels) {
              if (parentLabels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parentNumber,
                  name: label,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parentNumber,
              body: `> *This was generated by AI during triage.*\n\n## Spec completed\n\nAll linked ticket issues are closed: ${completedChildren}.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parentNumber,
              state: "closed",
            });

            core.info(`Closed completed spec #${parentNumber}.`);
