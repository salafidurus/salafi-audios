name: react-doctor

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - spec/**
    paths:
      - "apps/web/**"
      - "apps/native/**"
      - "packages/core-api/**"
      - "packages/core-contracts/**"
      - "packages/core-i18n/**"
      - "packages/core-sync/**"
      - "packages/design-tokens/**"
      - "packages/domain-account/**"
      - "packages/domain-audio/**"
      - "packages/domain-content/**"
      - "packages/domain-search/**"
      - "packages/utils-error/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/react-doctor.yml"

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          blocking: warning
