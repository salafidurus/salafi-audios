name: tsdoc-quality

on:
  pull_request:
    paths:
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - ".oxlintrc.tsdoc.json"
      - "tools/oxlint/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/tsdoc-quality.yml"

permissions:
  contents: read

jobs:
  tsdoc_quality:
    name: tsdoc:quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (scripts disabled)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: TSDoc quality
        run: bun run tsdoc:quality
