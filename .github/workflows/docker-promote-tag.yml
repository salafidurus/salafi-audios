name: docker-promote-tag

on:
  push:
    branches:
      - preview
      - production

concurrency:
  group: docker-promote-tag-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/salafi-durus-api

jobs:
  promote:
    name: Promote approved API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve merge source commit
        id: merge
        env:
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -eu
          parents=$(git rev-list --parents -n 1 "$PUSH_SHA")
          set -- $parents
          if [ "$#" -ne 3 ]; then
            echo "::error::Expected a two-parent merge commit for $PUSH_SHA; refusing to guess an image."
            exit 1
          fi
          echo "source_sha=$3" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$1" >> "$GITHUB_OUTPUT"
          echo "Promoting source commit $3 from merge commit $1"

      - name: Verify and promote the preview artifact
        if: github.ref_name == 'preview'
        env:
          SOURCE_SHA: ${{ steps.merge.outputs.source_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -eu
          image="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"

          digest=$(docker buildx imagetools inspect "$image" 2>/dev/null | awk '/^Digest:/ { print $2; exit }')
          if [ -z "$digest" ]; then
            echo "::error::Required SHA image does not exist: $image"
            exit 1
          fi
          case "$digest" in sha256:*) ;; *) echo "::error::Invalid image digest: $digest"; exit 1 ;; esac

          ensure_marker() {
            marker="$1"
            existing=$(docker buildx imagetools inspect "$marker" 2>/dev/null | awk '/^Digest:/ { print $2; exit }' || true)
            if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
              echo "::error::Approval marker already points to $existing, expected $digest: $marker"
              exit 1
            fi
            if [ -z "$existing" ]; then
              docker buildx imagetools create --tag "$marker" "${IMAGE_REPOSITORY}@${digest}"
            fi
          }

          docker buildx imagetools create --tag "${IMAGE_REPOSITORY}:preview" "${IMAGE_REPOSITORY}@${digest}"
          ensure_marker "${IMAGE_REPOSITORY}:preview-approved-${SOURCE_SHA}"
          ensure_marker "${IMAGE_REPOSITORY}:preview-approved-${MERGE_SHA}"
          echo "Preview now points to $digest"

      - name: Verify and promote the preview-approved production artifact
        if: github.ref_name == 'production'
        env:
          PREVIEW_MERGE_SHA: ${{ steps.merge.outputs.source_sha }}
        run: |
          set -eu
          marker="${IMAGE_REPOSITORY}:preview-approved-${PREVIEW_MERGE_SHA}"
          digest=$(docker buildx imagetools inspect "$marker" 2>/dev/null | awk '/^Digest:/ { print $2; exit }')
          if [ -z "$digest" ]; then
            echo "::error::Production source was not previously approved in preview: $marker"
            exit 1
          fi
          case "$digest" in sha256:*) ;; *) echo "::error::Invalid approved image digest: $digest"; exit 1 ;; esac

          docker buildx imagetools create --tag "${IMAGE_REPOSITORY}:production" "${IMAGE_REPOSITORY}@${digest}"
          echo "Production now points to the preview-approved digest $digest"
