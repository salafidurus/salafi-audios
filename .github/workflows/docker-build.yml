name: docker-build

on:
  pull_request:
    branches:
      - main
      - preview
      - spec/**
    paths:
      - "docker/**"
      - "apps/api/**"
      - "packages/core-api/**"
      - "packages/core-contracts/**"
      - "packages/core-db/**"
      - "packages/core-i18n/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: docker-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/salafi-durus-api

jobs:
  build-health-publish:
    name: Build, healthcheck & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build image once (load into local daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dummy values satisfy the API startup schema. /health/healthz is a
      # liveness probe and does not require a reachable database or CDN.
      - name: Run the container
        run: |
          set -eu
          docker run -d --name salafidurus-api-ci \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e PRIMARY_DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            -e ANALYTICS_DATABASE_URL=postgresql://ci:ci@localhost:5432/ci_analytics \
            -e ANALYTICS_IDENTITY_HMAC_SECRET=ci-analytics-identity-secret-0123456789 \
            -e NEON_API_KEY=dummy-neon-api-key \
            -e NEON_PROJECT_ID=dummy-neon-project \
            -e NEON_ENDPOINT_ID=ep-dummy-neon-endpoint \
            -e BETTER_AUTH_SECRET=e2e-test-secret-must-be-at-least-32-chars-long \
            -e BETTER_AUTH_URL=http://localhost:4000 \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e GOOGLE_CLIENT_ID=dummy \
            -e GOOGLE_CLIENT_SECRET=dummy \
            -e APPLE_CLIENT_ID=dummy \
            -e APPLE_CLIENT_SECRET=dummy \
            -e R2_ACCOUNT_ID=dummy \
            -e R2_ACCESS_KEY_ID=dummy \
            -e R2_SECRET_ACCESS_KEY=dummy \
            -e R2_BUCKET_NAME=dummy \
            -e R2_PUBLIC_BASE_URL=http://dummy.test \
            "${IMAGE_REPOSITORY}:sha-${{ github.event.pull_request.head.sha }}"

      - name: Wait for /health/healthz (assert HTTP 200)
        run: |
          set -eu
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health/healthz || true)
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::/health/healthz did not return 200 (last code: ${code})"
            docker logs salafidurus-api-ci 2>&1 | tail -80 || true
            exit 1
          fi
          echo "::notice::/health/healthz is up (HTTP 200 after ${i} attempts)"
          curl -fsS http://127.0.0.1:4000/health/healthz

      - name: Log in to GHCR for trusted preview PRs
        if: github.base_ref == 'preview' && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable PR SHA image
        if: github.base_ref == 'preview' && github.event.pull_request.head.repo.full_name == github.repository
        run: docker push "${IMAGE_REPOSITORY}:sha-${{ github.event.pull_request.head.sha }}"

      - name: Skip GHCR publication for fork or main PRs
        if: github.base_ref != 'preview' || github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Publication skipped; build and health validation completed."

      - name: Show container logs
        if: always()
        run: docker logs salafidurus-api-ci 2>&1 | tail -50

      - name: Cleanup
        if: always()
        run: docker rm -f salafidurus-api-ci || true
