name: docker-verify

on:
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"

concurrency:
  group: docker-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: salafidurus-api:ci

jobs:
  # 1) Verify the Dockerfile itself is valid before anything is built:
  #    static lint (hadolint) + a BuildKit `--check` (no image build).
  validate-dockerfile:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: docker/api/Dockerfile
          # Fail only on error-severity findings; warnings/style are advisory.
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Dockerfile validity (BuildKit --check)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          call: check

  # 2) Build the real image, deploy it in the runner, and confirm the API is
  #    actually listening on 0.0.0.0:4000 with a live /health/healthz.
  build-and-healthcheck:
    name: Build, run & healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load into local daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dummy values only — enough for the NestJS env schema (zod) to validate
      # at startup. /health/healthz is a pure liveness probe (HTTP 200 while
      # the process is alive) and does not need a reachable DB/CDN.
      - name: Run the container
        run: |
          docker run -d --name salafidurus-api-ci \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            -e BETTER_AUTH_SECRET=e2e-test-secret-must-be-at-least-32-chars-long \
            -e BETTER_AUTH_URL=http://localhost:4000 \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e GOOGLE_CLIENT_ID=dummy \
            -e GOOGLE_CLIENT_SECRET=dummy \
            -e APPLE_CLIENT_ID=dummy \
            -e APPLE_CLIENT_SECRET=dummy \
            -e R2_ACCOUNT_ID=dummy \
            -e R2_ACCESS_KEY_ID=dummy \
            -e R2_SECRET_ACCESS_KEY=dummy \
            -e R2_BUCKET_NAME=dummy \
            -e R2_PUBLIC_BASE_URL=http://dummy.test \
            "$IMAGE_NAME"

      - name: Wait for /health/healthz (assert HTTP 200)
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health/healthz || true)
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          if [ "$code" = "200" ]; then
            echo "::notice::/health/healthz is up (HTTP 200 after ${i} attempts)"
            echo "body:"
            curl -s http://127.0.0.1:4000/health/healthz
            echo
          else
            echo "::error::/health/healthz did not return 200 (last code: ${code})"
            docker logs salafidurus-api-ci 2>&1 | tail -80 || true
            exit 1
          fi

      - name: Show container logs
        if: always()
        run: docker logs salafidurus-api-ci 2>&1 | tail -50

      - name: Cleanup
        if: always()
        run: docker rm -f salafidurus-api-ci || true
